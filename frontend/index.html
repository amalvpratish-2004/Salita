<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Salita AI - Live Voice Call & Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #121212; color: #fff; }
        .container { display: flex; gap: 20px; }
        .box { flex: 1; padding: 20px; background: #1e1e1e; border-radius: 8px; border: 1px solid #333; }
        button, select { padding: 12px 20px; font-size: 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        select { background: #2a2a2a; color: #fff; border: 1px solid #444; }
        button:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; }
        .start { background: #28a745; color: white; }
        .stop { background: #dc3545; color: white; }
        .speak { background: #007bff; color: white; }
        .recording { background: #ff3333; color: white; animation: pulse 1s infinite; }
        .nudge { background: #ff9800; color: #000; padding: 10px; border-radius: 4px; margin-top: 10px; font-weight: bold; }
        .transcript { height: 300px; overflow-y: auto; background: #000; padding: 10px; border-radius: 4px; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>Salita Voice Agent - Live Call Studio</h1>
    <p>Status: <span id="status" style="color: yellow;">Disconnected</span></p>
    
    <div style="display: flex; gap: 12px; align-items: center;">
        <label for="marketSelect"><b>Market Region:</b></label>
        <select id="marketSelect">
            <option value="EN">🇺🇸 English (US)</option>
            <option value="PH">🇵🇭 Philippines (Taglish)</option>
            <option value="ID">🇮🇩 Indonesia (Bahasa)</option>
        </select>

        <button id="callBtn" class="start" onclick="toggleCall()">Start Live Call</button>
        <button id="speakBtn" class="speak" onclick="toggleSpeaking()" disabled>🎙️ Click to Speak</button>
    </div>
    <br><br>

    <div class="container">
        <div class="box">
            <h3>Live Conversation</h3>
            <div id="transcript" class="transcript"></div>
        </div>
        <div class="box">
            <h3>Q4 Real-Time Nudges</h3>
            <div id="nudges"><i>No nudges triggered yet...</i></div>
            <hr>
            <h4>Qualification State</h4>
            <p>Status: <b id="qualStatus">N/A</b></p>
            <p>Missing Field: <b id="missingField">None</b></p>
        </div>
    </div>

    <script>
        let ws, mediaRecorder, audioStream;
        let isCalling = false;
        let isRecording = false;
        let audioChunks = [];

        // --- Progressive TTS playback state ---
        const MSE_SUPPORTED = window.MediaSource && MediaSource.isTypeSupported('audio/mpeg');
        let mediaSource, sourceBuffer, ttsAudioEl, pendingAudioChunks = [], streamEnded = false;
        let fallbackChunks = []; // used only when MSE isn't supported (e.g. Safari)

        // --- Text held back until audio is actually audible ---
        let pendingSalitaMessage = null; // { text, qualification_status, missing_field }

        function showTypingIndicator() {
            const t = document.getElementById('transcript');
            if (document.getElementById('typingIndicator')) return;
            t.innerHTML += `<p id="typingIndicator"><b>Salita:</b> <i>…</i></p>`;
            t.scrollTop = t.scrollHeight;
        }

        function revealPendingSalitaMessage() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();

            if (!pendingSalitaMessage) return;
            const t = document.getElementById('transcript');
            t.innerHTML += `<p><b>Salita:</b> ${pendingSalitaMessage.text}</p>`;
            t.scrollTop = t.scrollHeight;

            document.getElementById('qualStatus').innerText = pendingSalitaMessage.qualification_status || 'N/A';
            document.getElementById('missingField').innerText = pendingSalitaMessage.missing_field || 'None';
            pendingSalitaMessage = null;
        }

        function resetSpeakButton() {
            const speakBtn = document.getElementById('speakBtn');
            speakBtn.disabled = false;
            speakBtn.innerText = '🎙️ Click to Speak';
            speakBtn.className = 'speak';
        }

        function appendNextAudioChunk() {
            if (sourceBuffer && !sourceBuffer.updating && pendingAudioChunks.length > 0) {
                sourceBuffer.appendBuffer(pendingAudioChunks.shift());
            }
        }

        function startAudioStream() {
            const speakBtn = document.getElementById('speakBtn');
            speakBtn.innerText = '🔊 Salita is speaking...';
            speakBtn.disabled = true;
            streamEnded = false;

            if (!MSE_SUPPORTED) {
                fallbackChunks = [];
                return;
            }

            pendingAudioChunks = [];
            mediaSource = new MediaSource();
            ttsAudioEl = new Audio();
            ttsAudioEl.src = URL.createObjectURL(mediaSource);
            ttsAudioEl.onended = resetSpeakButton;
            ttsAudioEl.onerror = () => { resetSpeakButton(); revealPendingSalitaMessage(); };

            mediaSource.addEventListener('sourceopen', () => {
                sourceBuffer = mediaSource.addSourceBuffer('audio/mpeg');
                sourceBuffer.addEventListener('updateend', appendNextAudioChunk);
                appendNextAudioChunk();
            }, { once: true });

            // Play as soon as the browser has buffered enough to start.
            ttsAudioEl.addEventListener('canplay', () => {
                ttsAudioEl.play().catch(() => {});
            }, { once: true });

            // Reveal the held-back text at the moment sound actually starts, not before.
            ttsAudioEl.addEventListener('playing', revealPendingSalitaMessage, { once: true });
        }

        function pushAudioChunk(arrayBuffer) {
            if (!MSE_SUPPORTED) {
                fallbackChunks.push(arrayBuffer);
                return;
            }
            pendingAudioChunks.push(arrayBuffer);
            appendNextAudioChunk();
        }

        function endAudioStream() {
            streamEnded = true;

            if (!MSE_SUPPORTED) {
                const blob = new Blob(fallbackChunks, { type: 'audio/mp3' });
                const audio = new Audio(URL.createObjectURL(blob));
                const speakBtn = document.getElementById('speakBtn');
                speakBtn.innerText = '🔊 Salita is speaking...';
                speakBtn.disabled = true;
                audio.onended = resetSpeakButton;
                audio.onerror = resetSpeakButton;
                audio.addEventListener('playing', revealPendingSalitaMessage, { once: true });
                audio.play().catch(() => { resetSpeakButton(); revealPendingSalitaMessage(); });
                return;
            }

            const tryClose = () => {
                if (!sourceBuffer || (!sourceBuffer.updating && pendingAudioChunks.length === 0)) {
                    if (mediaSource && mediaSource.readyState === 'open') {
                        try { mediaSource.endOfStream(); } catch (e) { /* already closed */ }
                    }
                    // Safety net: if playback hasn't started within 4s of the stream fully
                    // arriving (e.g. autoplay blocked, decode stall), show the text anyway
                    // rather than leaving it hidden indefinitely.
                    setTimeout(revealPendingSalitaMessage, 4000);
                } else {
                    setTimeout(tryClose, 30);
                }
            };
            tryClose();
        }

        async function toggleCall() {
            const btn = document.getElementById('callBtn');
            const speakBtn = document.getElementById('speakBtn');
            const marketSelect = document.getElementById('marketSelect');

            if (!isCalling) {
                try {
                    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch (err) {
                    alert('Microphone access is required.');
                    return;
                }

                // Pass the selected market code to backend (EN, PH, or ID)
                const selectedMarket = marketSelect.value;
                ws = new WebSocket(`ws://localhost:8000/ws/call?market=${selectedMarket}`);
                ws.binaryType = 'arraybuffer'; // deliver binary frames as ArrayBuffer, not Blob

                ws.onopen = () => {
                    document.getElementById('status').innerText = `Connected / Live (${selectedMarket})`;
                    document.getElementById('status').style.color = '#28a745';
                    btn.innerText = 'End Call';
                    btn.className = 'stop';
                    speakBtn.disabled = false;
                    marketSelect.disabled = true; // Lock dropdown while in active call
                    isCalling = true;
                };

                ws.onmessage = async (event) => {
                    if (typeof event.data === "string") {
                        const data = JSON.parse(event.data);
                        if (data.type === "transcript") {
                            if (data.speaker === "User") {
                                const t = document.getElementById('transcript');
                                t.innerHTML += `<p><b>${data.speaker}:</b> ${data.text}</p>`;
                                t.scrollTop = t.scrollHeight;
                            } else {
                                // Hold Salita's text back — it's revealed by revealPendingSalitaMessage()
                                // once audio playback actually starts, so text and voice land together.
                                pendingSalitaMessage = {
                                    text: data.text,
                                    qualification_status: data.qualification_status,
                                    missing_field: data.missing_field
                                };
                                showTypingIndicator();
                            }
                        } else if (data.type === "nudge") {
                            document.getElementById('nudges').innerHTML = `
                                <div class="nudge">
                                    🚨 [${data.priority}] ${data.signal.toUpperCase()}<br>
                                    ${data.text}
                                </div>` + document.getElementById('nudges').innerHTML;
                        } else if (data.type === "audio_start") {
                            startAudioStream();
                        } else if (data.type === "audio_end") {
                            endAudioStream();
                        }
                    } else {
                        // Binary WS frame = one chunk of the TTS stream. Push it straight into
                        // the player instead of waiting to collect the whole response.
                        pushAudioChunk(event.data);
                    }
                };

                ws.onclose = () => endCallSession();

            } else {
                if (ws) ws.close();
                endCallSession();
            }
        }

        function toggleSpeaking() {
            const speakBtn = document.getElementById('speakBtn');

            if (!isRecording) {
                audioChunks = [];
                mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const completeBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    if (ws && ws.readyState === WebSocket.OPEN && completeBlob.size > 0) {
                        ws.send(completeBlob);
                    }
                };

                mediaRecorder.start();
                isRecording = true;
                speakBtn.innerText = '🔴 Recording... Click to Send';
                speakBtn.className = 'recording';
            } else {
                mediaRecorder.stop();
                isRecording = false;
                speakBtn.innerText = '⏳ Salita is thinking...';
                speakBtn.className = 'speak';
                speakBtn.disabled = true; 
            }
        }

        function endCallSession() {
            if (audioStream) audioStream.getTracks().forEach(track => track.stop());
            if (isRecording && mediaRecorder) mediaRecorder.stop();

            const btn = document.getElementById('callBtn');
            const speakBtn = document.getElementById('speakBtn');
            const marketSelect = document.getElementById('marketSelect');

            document.getElementById('status').innerText = 'Disconnected';
            document.getElementById('status').style.color = 'yellow';
            
            btn.innerText = 'Start Live Call';
            btn.className = 'start';
            speakBtn.innerText = '🎙️ Click to Speak';
            speakBtn.className = 'speak';
            speakBtn.disabled = true;
            marketSelect.disabled = false; // Re-enable selector

            isCalling = false;
            isRecording = false;
        }
    </script>
</body>
</html>
